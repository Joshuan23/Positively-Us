<title>Positively Us</title>
<style>

    --pink: #ff4d8d; --purple: #7b61ff; --teal: #00d1c1; --amber: #ffb347;
    --pink-2: #ff7ac8; --navy: #1a1b2e;

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--line); background: var(--bg-2); color: var(--muted); border-radius: 999px;

  .conv .unread { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 999px; background: var(--pink); color: #fff; font-size: 11px; font-weight: 700; margin-top: 4px; }

  .chat-head { display: flex; align-items: center; gap: 10px; padding: 4px 0 14px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }

  .bubble { max-width: 76%; padding: 10px 14px; border-radius: 16px; font-size: 14px; }
  .bubble.me { align-self: flex-end; background: var(--grad); color: #fff; border-bottom-right-radius: 5px; }
  .bubble.them { align-self: flex-start; background: var(--bg-2); border: 1px solid var(--line); border-bottom-left-radius: 5px; }
  .chat-input { display: flex; gap: 8px; position: sticky; bottom: 0; padding-top: 10px; background: var(--bg); }
  .chat-input input { flex: 1; border-radius: 999px; }

  .prof-hero { text-align: center; padding: 6px 0 4px; }
  .prof-hero .av { width: 96px; height: 96px; margin: 0 auto 8px; border-radius: 50%; display: grid; place-items: center; font-size: 46px; background: var(--bg-2); border: 2px solid var(--line); }
  .emoji-picker { display: flex; flex-wrap: wrap; gap: 6px; }
  .emoji-picker button { font-size: 24px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; }
  .emoji-picker button.on { border-color: var(--purple); background: var(--card-2); }
  .consent { display: flex; gap: 10px; align-items: flex-start; background: rgba(255,179,71,.08); border: 1px solid rgba(255,179,71,.3); border-radius: 12px; padding: 12px; margin-top: 14px; }
  .consent input { width: auto; margin-top: 3px; }
  .consent label { margin: 0; color: var(--text); font-weight: 500; font-size: 13px; }
  .toggle { display: flex; align-items: center; gap: 10px; margin-top: 10px; }

  .center { display: grid; place-items: center; min-height: 70vh; }

  .demobar { max-width: 460px; margin: 0 auto; padding: 8px 14px; font-size: 12px; color: var(--muted);
    text-align: center; background: rgba(123,97,255,.12); border-bottom: 1px solid var(--line); }
  .demobar b { color: var(--pink-2); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
(function () {
  const appEl = document.getElementById('app');

  // ---------------- In-memory demo backend ----------------
  const META = {
    conditions: ['Herpes (HSV-1)','Herpes (HSV-2)','HPV','HIV','Hepatitis B','Hepatitis C','Chlamydia','Gonorrhea','Syphilis','Trichomoniasis','Molluscum contagiosum','Other'],
    genders: ['Woman','Man','Non-binary','Transgender woman','Transgender man','Genderfluid','Agender','Other'],
    pronouns: ['she/her','he/him','they/them','she/they','he/they','ze/zir','Ask me'],
    orientations: ['Straight','Gay','Lesbian','Bisexual','Pansexual','Queer','Asexual','Questioning'],
    interests: ['Hiking','Coffee','Music','Art','Yoga','Cooking','Travel','Gaming','Reading','Movies','Fitness','Dogs','Cats','Photography','Dancing','Foodie','Live shows','Volunteering','Nature','Tech'],
    lookingFor: ['A long-term relationship','Something casual','New friendships','Community & support','Still figuring it out'],
    uuCondition: 'HIV', minAge: 21,
  };

  const DB = {
    users: [
      { id:1, email:'alex@example.com', name:'Alex', birthdate:'1996-03-11', gender:'Non-binary', pronouns:'they/them', seeking:['Woman','Man','Non-binary'], orientation:'Queer', location:'Los Angeles, USA', bio:'Dog lover 🐶, coffee addict ☕, sunrise chaser 🌅, and always down for a deep conversation.', conditions:['HIV'], undetectable:true, interests:['Hiking','Coffee','Music','Art','Yoga','Cooking'], lookingFor:['A long-term relationship','New friendships'], verified:true, emoji:'🌈' },
      { id:2, email:'jordan@example.com', name:'Jordan', birthdate:'1990-09-01', gender:'Man', pronouns:'he/him', seeking:['Woman','Non-binary'], orientation:'Bisexual', location:'Los Angeles, USA', bio:'Software dev by day, home cook by night. Living well and undetectable.', conditions:['HIV'], undetectable:true, interests:['Hiking','Coffee','Music','Gaming','Foodie'], lookingFor:['A long-term relationship'], verified:true, emoji:'🎧' },
      { id:3, email:'maya@example.com', name:'Maya', birthdate:'1994-04-12', gender:'Woman', pronouns:'she/her', seeking:['Man','Non-binary'], orientation:'Bisexual', location:'Austin, USA', bio:'Yoga teacher, plant hoarder, and terrible at board games. HSV-2, stigma-free zone.', conditions:['Herpes (HSV-2)'], undetectable:false, interests:['Yoga','Nature','Cooking','Travel','Dogs'], lookingFor:['Community & support','New friendships'], verified:true, emoji:'🌻' },
      { id:4, email:'sam@example.com', name:'Sam', birthdate:'1996-02-20', gender:'Non-binary', pronouns:'they/them', seeking:['Woman','Non-binary','Man'], orientation:'Pansexual', location:'Portland, USA', bio:'Illustrator and dog parent. Big believer in honesty and soft launches.', conditions:['HPV'], undetectable:false, interests:['Art','Photography','Dogs','Movies','Live shows'], lookingFor:['Something casual','New friendships'], verified:false, emoji:'🦋' },
      { id:5, email:'lena@example.com', name:'Lena', birthdate:'1988-11-30', gender:'Woman', pronouns:'she/her', seeking:['Woman'], orientation:'Lesbian', location:'Chicago, USA', bio:'Nurse, marathoner, and matcha addict. HSV-1, managed and open about it.', conditions:['Herpes (HSV-1)'], undetectable:false, interests:['Fitness','Reading','Coffee','Travel','Cooking'], lookingFor:['A long-term relationship'], verified:true, emoji:'🏃' },
      { id:6, email:'theo@example.com', name:'Theo', birthdate:'1992-07-08', gender:'Man', pronouns:'he/him', seeking:['Woman','Non-binary'], orientation:'Straight', location:'Denver, USA', bio:'Rock climber and amateur baker. Managing Hep B — happy to talk about it openly.', conditions:['Hepatitis B'], undetectable:false, interests:['Fitness','Cooking','Nature','Music','Foodie'], lookingFor:['A long-term relationship','New friendships'], verified:false, emoji:'🧗' },
    ],
    likes: [
      { liker:1, likee:2, pass:false }, { liker:2, likee:1, pass:false }, // Alex ↔ Jordan matched
      { liker:3, likee:1, pass:false }, // Maya likes Alex
      { liker:4, likee:1, pass:false }, // Sam likes Alex
    ],
    messages: [
      { sender:2, receiver:1, body:'Hey! How was your weekend? 😊', read:false, at: Date.now()-1000*60*90 },
    ],
    visits: [ { viewer:2, viewed:1 }, { viewer:5, viewed:1 } ],
    session: null,
    nextId: 100,
  };

  const nowISO = () => new Date().toISOString().replace('T',' ').slice(0,19);
  function ageFrom(bd) {
    const d = new Date(bd + 'T00:00:00'); if (isNaN(d)) return NaN;
    const n = new Date(); let a = n.getFullYear()-d.getFullYear();
    const m = n.getMonth()-d.getMonth(); if (m<0||(m===0&&n.getDate()<d.getDate())) a--; return a;
  }
  const uById = (id) => DB.users.find(u => u.id === id);
  function card(u) {
    return { id:u.id, displayName:u.name, age:ageFrom(u.birthdate), gender:u.gender, pronouns:u.pronouns,
      orientation:u.orientation, location:u.location, bio:u.bio, conditions:u.conditions.slice(),
      undetectable:!!u.undetectable, interests:u.interests.slice(), lookingFor:u.lookingFor.slice(),
      verified:!!u.verified, photoEmoji:u.emoji };
  }
  function publicUser(u) { const c = card(u); c.email = u.email; c.seeking = u.seeking.slice(); return c; }
  const matchedPair = (a,b) =>
    DB.likes.some(l=>l.liker===a&&l.likee===b&&!l.pass) && DB.likes.some(l=>l.liker===b&&l.likee===a&&!l.pass);

  // Mock API mirroring the real server routes.
  function api(path, opts) {
    opts = opts || {}; const body = opts.body || {}; const me = DB.session;
    const seg = path.split('/').filter(Boolean); // e.g. ['messages','2']
    const need = () => { if (!me) throw new Error('Not signed in.'); };

    if (path === '/meta') return META;

    if (path === '/auth/register') {
      const b = body;
      if (!b.email||!b.password||!b.displayName||!b.birthdate||!b.gender) throw new Error('Please fill in all required fields.');
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(b.email)) throw new Error('Please enter a valid email address.');
      if (String(b.password).length < 8) throw new Error('Password must be at least 8 characters.');
      if (!b.ageConfirm) throw new Error('You must confirm you are 21 or older.');
      if (!(ageFrom(b.birthdate) >= 21)) throw new Error('You must be at least 21 years old to join Positively Us.');
      if (!(b.seeking||[]).length) throw new Error('Please choose who you are open to meeting.');
      if (!(b.conditions||[]).filter(Boolean).length) throw new Error('Disclosure is required. Please share at least one status (or your own note) so members can make informed, respectful choices.');
      if (DB.users.some(u=>u.email===b.email.toLowerCase())) throw new Error('An account with that email already exists.');
      const u = { id: DB.nextId++, email:b.email.toLowerCase(), name:b.displayName.slice(0,40), birthdate:b.birthdate,

    s.innerHTML=`<div class="pcard"><div class="photo">${esc(p.photoEmoji)}<div class="top-badges">${p.verified?`<span class="badge-soft">✔︎ Verified</span>`:'<span></span>'}<span class="badge-soft">${idx+1}/${deck.length}</span></div></div>
      <div class="info"><div class="name">${esc(p.displayName)}, ${p.age} ${vMark(p.verified)}</div>
      <div class="sub">${[p.pronouns,p.gender].filter(Boolean).map(esc).join(' · ')}${p.orientation?' · '+esc(p.orientation):''}</div>
      <div class="sub">${p.location?'📍 '+esc(p.location):''}</div>
      <div class="status-line">${p.conditions.map(c=>`<span class="tag">💬 ${esc(c)}</span>`).join('')} ${uu}</div>
      ${p.bio?`<div class="block-label">About</div><div class="bio">${esc(p.bio)}</div>`:''}
      ${p.lookingFor.length?`<div class="block-label">Looking for</div><div class="chips">${p.lookingFor.map(l=>`<span class="chip on">${esc(l)}</span>`).join('')}</div>`:''}
      ${p.interests.length?`<div class="block-label">Interests</div><div>${p.interests.map(i=>`<span class="tag interest">${esc(i)}</span>`).join('')}</div>`:''}</div></div>
      <div class="actions"><button class="circle-btn pass" data-act="pass" title="Pass">✕</button><button class="circle-btn like" data-act="like" title="Like">♥</button></div>`;
    s.querySelector('[data-act="pass"]').addEventListener('click',()=>act(s,p,true));
    s.querySelector('[data-act="like"]').addEventListener('click',()=>act(s,p,false));
  }
  function act(s,p,pass){ try{ const {matched,matchUser}=api('/likes',{method:'POST',body:{userId:p.id,pass}}); state.data.deckIdx=(state.data.deckIdx||0)+1; if(matched&&matchUser) showMatchModal(matchUser); }catch(e){ state.data.deckIdx=(state.data.deckIdx||0)+1; } paintCard(s); }
  function showMatchModal(m){
    const icons={Hiking:'🥾',Coffee:'☕',Music:'🎵',Art:'🎨',Yoga:'🧘',Cooking:'🍳',Travel:'✈️',Gaming:'🎮'};
    const o=document.createElement('div'); o.className='overlay';
    o.innerHTML=`<div class="match-modal"><h2>It's a Match! 💜</h2><p style="color:var(--muted);margin:0">You and ${esc(m.displayName)} liked each other.</p>
      <div class="match-avatars"><div class="av">${esc(state.user.photoEmoji)}</div><div class="heart">💜</div><div class="av">${esc(m.photoEmoji)}</div></div>
      ${(m.sharedInterests&&m.sharedInterests.length)?`<div class="shared">${m.sharedInterests.slice(0,3).map(i=>`<div class="item"><div class="b">${icons[i]||'✨'}</div>You both like ${esc(i)}</div>`).join('')}</div>`:''}
      <button class="btn block" data-msg>Send a Message</button><button class="btn ghost block" style="margin-top:10px" data-keep>Keep Swiping</button></div>`;
    document.body.appendChild(o);
    o.querySelector('[data-keep]').addEventListener('click',()=>o.remove());
    o.querySelector('[data-msg]').addEventListener('click',()=>{ o.remove(); state.screen='messages'; state.chatWith=m.id; render(); });
    o.addEventListener('click',e=>{ if(e.target===o) o.remove(); });
  }

  // Community
  function renderCommunity(s){ const c=api('/community');
    s.innerHTML=`<h2 style="margin:2px 0 4px">Community</h2><p style="color:var(--muted);margin:0 0 8px;font-size:14px">Connect beyond dating — events, groups, education &amp; support.</p>
      <div class="section-head"><h3>Upcoming Events</h3></div>
      ${c.events.map(e=>`<div class="event-item"><div class="emoji">${e.emoji}</div><div style="flex:1"><h4>${esc(e.title)} <span class="tag">${esc(e.tag)}</span></h4><div class="when">${esc(e.date)}</div><div class="blurb">${esc(e.blurb)}</div></div></div>`).join('')}
      <div class="section-head"><h3>Learn &amp; Support</h3></div>
      <div class="card-soft">${c.resources.map(r=>`<div class="res-item"><div class="emoji">${r.emoji}</div><div><h4>${esc(r.title)} <span class="tag interest">${esc(r.tag)}</span></h4><p>${esc(r.blurb)}</p></div></div>`).join('')}</div>
      <div class="section-head"><h3>Groups</h3></div>
      <div class="group-row">${c.groups.map(g=>`<div class="group"><div class="emoji">${g.emoji}</div><div><div class="name">${esc(g.name)}</div><div class="cnt">${g.members.toLocaleString()} members</div></div></div>`).join('')}</div>`;
  }

  // Messages
  function renderMessages(s){
    if (state.chatWith) return renderThread(s, state.chatWith);
    const {matches}=api('/matches');
    if (!matches.length){ s.innerHTML=`<div class="empty"><div class="big">💬</div><h2>No conversations yet</h2><p>When you and someone both like each other, you can chat here.</p><button class="btn" data-disc>Start discovering</button></div>`;
      s.querySelector('[data-disc]').addEventListener('click',()=>go('discover')); return; }
    const q=state.data.msgSearch||''; const f=matches.filter(m=>m.displayName.toLowerCase().includes(q.toLowerCase()));
    s.innerHTML=`<h2 style="margin:2px 0 12px">Messages</h2>
      <div class="stories">${matches.map(m=>`<button class="story" data-open="${m.id}"><div class="ring"><div class="inner">${esc(m.photoEmoji)}</div></div><div class="lbl">${esc(m.displayName)}</div></button>`).join('')}</div>
      <div class="search-box"><span class="mag">🔍</span><input id="msg-search" placeholder="Search messages" value="${esc(q)}"/></div>
      <div id="conv-list">${f.map(convRow).join('')||'<div class="empty">No matches found.</div>'}</div>`;
    const search=document.getElementById('msg-search');
    search.addEventListener('input',()=>{ state.data.msgSearch=search.value; const list=document.getElementById('conv-list');
      const ff=matches.filter(m=>m.displayName.toLowerCase().includes(search.value.toLowerCase())); list.innerHTML=ff.map(convRow).join('')||'<div class="empty">No matches found.</div>'; wireConvs(s); });
    wireConvs(s);
  }
  function convRow(m){ return `<button class="conv" data-open="${m.id}"><div class="av">${esc(m.photoEmoji)}</div><div style="min-width:0"><div class="who">${esc(m.displayName)} ${vMark(m.verified)}</div><div class="snippet">${m.lastMessage?esc(m.lastMessage):'Say hello 👋'}</div></div><div class="meta"><div class="time">${m.lastMessageAt?timeAgo(m.lastMessageAt):''}</div>${m.unread?`<div class="unread">${m.unread}</div>`:''}</div></button>`; }
  function wireConvs(s){ s.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>{ state.chatWith=Number(b.dataset.open); renderMessages(s); })); }
  function renderThread(s,otherId){
    const {matches}=api('/matches'); const m=matches.find(x=>x.id===otherId); if(!m){ state.chatWith=null; return renderMessages(s); }
    s.innerHTML=`<div class="chat-head"><button class="icon-btn" data-back>‹</button><div class="av">${esc(m.photoEmoji)}</div><div><b>${esc(m.displayName)}, ${m.age}</b> ${vMark(m.verified)}<div style="font-size:12px;color:var(--muted)">${m.conditions.map(esc).join(' · ')}${m.undetectable?' · 💚 U=U':''}</div></div></div>
      <div class="messages" id="messages"></div>
      <form class="chat-input" id="chat-form"><input id="chat-text" placeholder="Write a message…" autocomplete="off" maxlength="2000"/><button class="btn" type="submit">Send</button></form>`;
    s.querySelector('[data-back]').addEventListener('click',()=>{ state.chatWith=null; renderMessages(s); });
    loadMessages(otherId);
    document.getElementById('chat-form').addEventListener('submit',e=>{ e.preventDefault(); const input=document.getElementById('chat-text'); const b=input.value.trim(); if(!b) return; input.value=''; try{ api('/messages/'+otherId,{method:'POST',body:{body:b}}); loadMessages(otherId); }catch(err){} });
  }
  function loadMessages(otherId){ const box=document.getElementById('messages'); if(!box) return;
    const {messages}=api('/messages/'+otherId);
    box.innerHTML=messages.length?messages.map(mm=>`<div class="bubble ${mm.fromMe?'me':'them'}">${esc(mm.body)}</div>`).join(''):`<div style="margin:auto;text-align:center;color:var(--muted)">This is the start of your conversation.<br/>Break the ice 💜</div>`;
    box.scrollTop=box.scrollHeight;
  }

  // Profile
  function renderProfile(s){
    const u=state.user; const m=state.meta;
    const ed=state.data.edit={seeking:u.seeking.slice(),conditions:u.conditions.slice(),interests:u.interests.slice(),lookingFor:u.lookingFor.slice(),photoEmoji:u.photoEmoji,undetectable:u.undetectable};
    const emojis=['🙂','😊','😎','🥰','🌻','🦋','🌈','🔥','🎧','📚','🌙','🐱'];
    s.innerHTML=`<div class="prof-hero"><div class="av">${esc(u.photoEmoji)}</div><h2 style="margin:2px 0">${esc(u.displayName)}, ${u.age} ${vMark(u.verified)}</h2>
      <div style="color:var(--muted);font-size:13px">${[u.pronouns,u.gender].filter(Boolean).map(esc).join(' · ')}</div>
      <div style="margin-top:8px">${u.conditions.map(c=>`<span class="tag">${esc(c)}</span>`).join('')}${u.undetectable?' <span class="pill-uu">💚 U=U</span>':''}</div></div>
      <div id="err"></div><div id="saved"></div>
      <label>Avatar</label><div class="emoji-picker" id="p-emoji">${emojis.map(e=>`<button type="button" class="${ed.photoEmoji===e?'on':''}" data-e="${e}">${e}</button>`).join('')}</div>
      <label>Pronouns</label><select id="p-pron"><option value="">—</option>${m.pronouns.map(p=>`<option ${p===u.pronouns?'selected':''}>${esc(p)}</option>`).join('')}</select>
      <label>Orientation</label><select id="p-orient"><option value="">—</option>${m.orientations.map(o=>`<option ${o===u.orientation?'selected':''}>${esc(o)}</option>`).join('')}</select>
      <label>Open to meeting</label><div class="chips" id="p-seeking">${m.genders.map(g=>chip(g,ed.seeking.includes(g),'g')).join('')}</div>
      <label>Health disclosure <span style="color:var(--pink)">*required</span></label><div class="chips" id="p-cond">${m.conditions.map(c=>chip(c,ed.conditions.includes(c),'c')).join('')}</div>
      <div id="p-uu-wrap" class="toggle" style="${ed.conditions.includes(m.uuCondition)?'':'display:none'}"><input type="checkbox" id="p-uu" ${ed.undetectable?'checked':''}/><label for="p-uu" style="margin:0">I'm undetectable (U=U) 💚</label></div>
      <label>Interests</label><div class="chips" id="p-int">${m.interests.map(i=>chip(i,ed.interests.includes(i),'i')).join('')}</div>
      <label>I'm looking for</label><div class="chips" id="p-lf">${m.lookingFor.map(l=>chip(l,ed.lookingFor.includes(l),'l')).join('')}</div>
      <label>Location</label><input id="p-loc" maxlength="80" value="${esc(u.location)}"/>
      <label>About you</label><textarea id="p-bio" maxlength="600">${esc(u.bio)}</textarea>
      <div style="height:16px"></div><button class="btn block" id="p-save">Save changes</button>
      <button class="btn ghost block" style="margin-top:10px" id="p-logout">Log out</button>`;
    wireChips('#p-seeking',ed.seeking); wireChips('#p-int',ed.interests); wireChips('#p-lf',ed.lookingFor);
    s.querySelectorAll('#p-cond .chip').forEach(c=>c.addEventListener('click',()=>{ toggle(ed.conditions,c.dataset.v); c.classList.toggle('on'); document.getElementById('p-uu-wrap').style.display=ed.conditions.includes(m.uuCondition)?'':'none'; }));
    s.querySelectorAll('#p-emoji button').forEach(b=>b.addEventListener('click',()=>{ ed.photoEmoji=b.dataset.e; s.querySelectorAll('#p-emoji button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); }));
    s.querySelector('#p-logout').addEventListener('click',()=>{ api('/auth/logout',{method:'POST'}); state.user=null; render(); });
    s.querySelector('#p-save').addEventListener('click',()=>{ const payload={ seeking:ed.seeking, conditions:ed.conditions, interests:ed.interests, lookingFor:ed.lookingFor, photoEmoji:ed.photoEmoji, undetectable:document.getElementById('p-uu')?.checked||false, pronouns:document.getElementById('p-pron').value, orientation:document.getElementById('p-orient').value, location:document.getElementById('p-loc').value.trim(), bio:document.getElementById('p-bio').value.trim() };
      try{ const {user}=api('/auth/me',{method:'PATCH',body:payload}); state.user=user; document.getElementById('saved').innerHTML=`<div class="notice" style="margin-top:12px">✅ Profile saved.</div>`; setTimeout(()=>renderProfile(s),600); }catch(e){ showErr('err',e.message); } });
  }

  renderLanding();
})();
</script>
